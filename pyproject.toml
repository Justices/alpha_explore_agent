[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-research"
version = "0.1.0"
description = "Evidence-driven Alpha research workflows for WorldQuant BRAIN"
requires-python = ">=3.11"
dependencies = ["requests>=2.28,<3"]

[project.optional-dependencies]
agy = ["google-antigravity>=0.1.16,<0.2"]

[tool.setuptools.package-data]
"alpha_research.agents" = ["model_registry.json", "role_profile.json"]

[tool.setuptools.packages.find]
include = ["alpha_research", "alpha_research.*"]
