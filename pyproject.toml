[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-research"
version = "0.1.0"
description = "Evidence-driven Alpha research workflows for WorldQuant BRAIN"
requires-python = ">=3.11"
dependencies = ["requests>=2.28,<3"]

[tool.setuptools.packages.find]
include = ["alpha_research", "alpha_research.*"]
