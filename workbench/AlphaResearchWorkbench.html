<dialog id="editor"><form id="form"><div class="dialog-head"><h2 id="form-title"></h2><button type="button" id="close" class="quiet" aria-label="关闭">✕</button></div><div id="fields"></div><p id="form-error" role="alert"></p><div class="dialog-actions"><button type="button" id="cancel" class="quiet">取消</button><button class="primary" type="submit">保存记录</button></div></form></dialog><input id="file" type="file" accept=".json,application/json" hidden><div id="toast" role="status"></div><script>"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const labels = {regular:"Regular Alpha",super:"Super Alpha",optimization:"指定 Alpha 优化"};
const pages = {board:["研究总览","Alpha 研究工作台","管理研究范围、回测证据与候选审计，追踪每条 Alpha 的研究决策。"],cases:["研究任务","研究任务","保留用户硬约束、平台有效组合、预算与研究分支。"],compare:["指标对比","回测指标对比","选择最多四条 Alpha，逐项比较已记录的回测指标。"],audit:["审核与优选","审核与优选","从终态 RA 证据开始，依次核对相关性、Candidate 和 Preferred 结果。"]};
const phases = {scope:"范围验证",hypothesis:"假设与构建",simulation:"回测证据",review:"审核",closed:"复盘归档"};
const metrics = {sharpe:"Sharpe",fitness:"Fitness",turnover:"Turnover",drawdown:"Drawdown",coverage:"Coverage",robustness:"Robustness",costs:"Transaction costs",local:"本地自相关",prod:"生产相关性",self:"平台自相关",pairwise:"最大组内相关性",weight:"最大权重"};
const DEFAULT_QUALIFICATION_POLICY = {
 candidate:{sharpe_min:1.58,china_sharpe_min:2.08,fitness_min:1,two_year_sharpe_min:1.6,
  margin_min:0.0005,risk_neutralized_sharpe_min:1,risk_neutralized_fitness_min:0.7,
  turnover_min:0.05,turnover_max:0.3,prod_corr_max:0.7,self_corr_max:0.7,pairwise_corr_max:0.4},
 preferred:{sharpe_min:1.25,fitness_min:1,turnover_min:0.01,turnover_max:0.7,
  weight_max:0.1,require_sub_universe_pass:true},
 policy_sha256:"aa2e10c68789543c5d8181ebfb4b97a717100c819029bb80cbd10c829c04f8b6"
};
function qualificationPolicy(){
 const current=agentStatus?.qualification_policy;
 return current?.status==="available"&&current.candidate&&current.preferred
  ?current:DEFAULT_QUALIFICATION_POLICY;
}
const statuses = {draft:"研究草稿",pending:"证据待补",raFail:"RA 未通过",corrReady:"待相关性",corrFail:"相关性未通过",audit:"待完整审计",candidate:"Candidate",preferred:"优选",blocked:"审核阻塞"};
const key = "alpha-research-desk-v1";
const localAgent = location.protocol === "http:" && location.hostname === "127.0.0.1";
let agentStatus, agentError, agentLoading = false, agentRefreshAt = 0;
let launchState, launchTimer, launchSubmitting = false, launchHistory = [];
let credentialsSubmitting = false;
let modelOptions = null;
const credentialEndpointUnavailable = "当前端口的工作台服务不支持凭证接口。请打开新版服务启动时显示的地址。";

async function readWorkbenchJson(response){
 const type=response.headers.get("Content-Type")?.split(";")[0].trim().toLowerCase();
 if(type!=="application/json")throw Error(credentialEndpointUnavailable);
 try{
   return await response.json();
 }catch{
   throw Error("工作台服务返回了无效数据，请刷新后重试。");
 }
}

async function refreshModels(){
 const response=await fetch("/api/models",{cache:"no-store"});
 const data=await readWorkbenchJson(response);
 if(!response.ok||!Array.isArray(data?.entries))throw Error(data.error||"模型注册中心不可用");
 modelOptions=Object.fromEntries(data.entries.map(entry=>[
   entry.id,entry.id+" · "+entry.kind+" / "+entry.provider+(entry.model?" / "+entry.model:"")
 ]));
 if(!Object.keys(modelOptions).length)throw Error("模型注册中心没有可选模型");
 return modelOptions;
}

async function refreshCredentials(){
 const credentials=$("#brain-credentials");
 const launchButtons=["#launch-campaign","#launch-super","#launch-optimization"].map($);
 const status=$("#credential-status");
 try{
   const response=await fetch("/api/credentials",{cache:"no-store"});
   const data=await readWorkbenchJson(response);
   if(!response.ok||typeof data?.configured!=="boolean")throw Error(credentialEndpointUnavailable);
   credentials.textContent=data.configured?"BRAIN 凭证已设置":"BRAIN 凭证";
   credentials.hidden=false;
   launchButtons.forEach(button=>button.hidden=false);
   status.textContent="";
 }catch(error){
   credentials.hidden=true;
   launchButtons.forEach(button=>button.hidden=true);
   status.textContent=error instanceof TypeError
     ?"暂时无法连接本地工作台服务，请检查启动地址。"
     :error.message;
 }
}

function showLaunchState(state){
 const previous=launchState?.status;
 const previouslyStopping=launchState?.stop_requested;
 launchState=state;
 const workflowLabels={regular:"Regular",super:"Super",optimization:"Alpha 优化",
                       regular_plan:"Regular 范围预检",super_plan:"Super 平台预检",
                       optimization_plan:"Alpha 来源预检",
                       super_recovery:"Super 回执核对",optimization_recovery:"优化回执核对"};
 const workflowLabel=workflowLabels[state.workflow]||"研究任务";
 const resultId=state.campaign_id||
   (state.workflow==="optimization"?state.branch_id:null)||
   state.plan_id||state.source_id||state.run_id||
   state.candidate_alpha_id||state.alpha_id||state.primary_id;
 const resultStatus=state.candidate_status
   ? "Candidate "+state.candidate_status+" / Preferred "+(state.preferred_status||"待评估")
   : state.result_status||state.campaign_status;
 const stopReasons={
   iteration_budget_exhausted:"迭代预算耗尽",
   preferred_candidate_reached:"已达到 Preferred",
   qualification_or_execution_evidence_unresolved:"执行或审核证据待补",
   user_stop_requested:"用户终止",
   duplicate_candidate_definition:"重复候选阻断",
   no_progress_repeated_failure_signature:"连续迭代无进展",
   independent_authorization_handoff:"等待独立授权"
 };
 const iterationText=Number.isInteger(state.iterations_completed)
   ? "完成 "+state.iterations_completed+" 轮"+
     (state.iteration_stop_reason?" · "+(stopReasons[state.iteration_stop_reason]||state.iteration_stop_reason):"")
   : "";
 const planDetails=[
   Number.isInteger(state.dataset_count)?"Dataset "+state.dataset_count:"",
   Number.isInteger(state.combination_count)?"组合 "+state.combination_count:"",
   Number.isInteger(state.eligible_alpha_count)?"可用 Alpha "+state.eligible_alpha_count:"",
   Number.isInteger(state.unresolved_count)?"待核实 "+state.unresolved_count:"",
   state.coverage_complete===true?"范围完整":state.coverage_complete===false?"范围未完整":"",
   state.source_type?"来源类型 "+state.source_type:"",
   state.region?"Region "+state.region:""
 ].filter(Boolean).join(" / ");
 const messages={idle:"",running:state.stop_requested?"正在终止研究":workflowLabel+" 执行中",
                 execution_unknown:state.recovery_message||"服务重启后旧任务执行状态未知；新任务已阻断。",
                 interrupted_acknowledged:"旧任务已由操作者确认结束，可以启动新任务。",
                 failed:"研究进程异常退出"+(Number.isInteger(state.exit_code)?"（退出码 "+state.exit_code+"）":"")};
 $("#launch-status").textContent=state.status==="exited"
   ? workflowLabel+" · "+[resultId,resultStatus,iterationText,planDetails].filter(Boolean).join(" · ")
   : messages[state.status]||"启动状态待核实";
 ["#launch-campaign","#launch-super","#launch-optimization"].forEach(selector=>{
   $(selector).disabled=launchSubmitting||["running","execution_unknown"].includes(state.status);
 });
 if(dialog.open&&editing?.kind==="launch"){
   const submit=$("#form").querySelector('button[type="submit"]');
   const preflight=$("#preflight");
   if(submit)submit.disabled=launchSubmitting||["running","execution_unknown"].includes(state.status);
   if(preflight)preflight.disabled=launchSubmitting||["running","execution_unknown"].includes(state.status);
 }
 if(previous==="running"&&state.status!=="running")refreshAgent();
 if(view==="cases"&&(previous!==state.status||previouslyStopping!==state.stop_requested))render();
 const log=$("#launch-events");
 if(log)log.textContent=launchEvents();
}

function launchEvents(){
 const events=launchState?.events||[];
 return events.length?events.map(event=>
   new Date(event.time).toLocaleTimeString("zh-CN")+"  "+event.message).join("\n"):
   "等待执行日志。";
}

async function refreshLaunch(){
 clearTimeout(launchTimer);
 try{
   const response=await fetch("/api/launch",{cache:"no-store"});
   if(!response.ok)throw Error();
   showLaunchState(await response.json());
   const historyResponse=await fetch("/api/launches",{cache:"no-store"});
   if(historyResponse.ok){
     const history=await historyResponse.json();
     const next=Array.isArray(history.items)?history.items:[];
     if(JSON.stringify(next)!==JSON.stringify(launchHistory)){
       launchHistory=next;
       if(view==="cases")render();
     }
   }
 }catch{
   $("#launch-status").textContent="启动状态暂不可读";
 }
 if(launchState?.status==="running"){
   if(view==="cases"&&Date.now()-agentRefreshAt>=10000)refreshAgent();
   launchTimer=setTimeout(refreshLaunch,2500);
 }
}
function agentPanel(){
 const refresh=localAgent?button(agentLoading?"读取中…":"刷新 Agent 状态","agent-refresh"):"";
 if(!localAgent)return panel("Agent 项目状态",blank("当前为独立文件模式","运行 python workbench/serve.py，再打开终端显示的地址，即可读取 Agent 项目状态。"));
 if(agentError)return panel("Agent 项目状态",blank("读取失败",agentError),refresh);
 if(!agentStatus)return panel("Agent 项目状态",blank("等待本地状态","正在读取项目研究记录。"),refresh);
 const groups=[
   ["Regular 任务",agentStatus.v11_campaigns],["Super 任务",agentStatus.v11_super_runs],
   ["优化分支",agentStatus.v11_candidate_branches],["Candidate 池",agentStatus.v11_candidates],
   ["Preferred 池",agentStatus.v11_preferred],["候选评估记录",agentStatus.v11_candidate_evaluations]
 ];
 const records=groups.flatMap(([kind,items])=>(items||[]).map(row=>[
   esc(kind),esc(row.campaign_id||row.run_id||row.branch_id||row.alpha_id||row.candidate_alpha_id||row.source_alpha_id||row.id||"—"),
   esc(row.workflow||"—"),esc(row.candidate_status||row.status||"—"),esc(row.preferred_status||"—")
 ]));
 const warning=agentStatus.global_alpha_pool?.status==="unavailable"
   ? '<p class="toolbar">Agent 候选池暂不可读，任务与评估记录仍可查看。</p>' : "";
 const evaluations=(agentStatus.v11_candidate_evaluations||[]).map(row=>{
   const metrics=row.metrics||{};
   return [
     esc(row.alpha_id||"—"),esc(row.workflow||"—"),
     esc(row.ra_fail_count===0?"0":row.ra_fail_count??"未取得"),
     esc(row.status||"—"),
     esc(metrics.sharpe??"—"),esc(metrics.turnover??"—"),esc(metrics.drawdown??"—"),
     esc((row.failures||[]).join(", ")||"—"),
     esc((row.pending||[]).join(", ")||"—")
   ];
 });
 const evaluationPanel=evaluations.length
   ?'<h3 style="padding:12px 17px 0">Candidate 审核记录（包含未通过与待补证据）</h3>'+
     table(["Alpha","流程","RA fail count","审核状态","Sharpe","Turnover","Drawdown","失败项","待补证据"],evaluations)
   :"";
 return panel("Agent 项目状态 · 只读",warning+(records.length
   ? table(["记录类型","Alpha / 任务 ID","工作流","状态","优选"],records)
   : blank("当前状态目录没有研究记录","如果 Agent 使用了自定义状态目录，请用 --state-root 启动。"))+evaluationPanel,refresh);
}
async function refreshAgent(){
 if(!localAgent||agentLoading)return;
 agentLoading=true;
 agentRefreshAt=Date.now();
 render();
 try{
   const result=await fetch("/api/status",{cache:"no-store"});
   if(!result.ok)throw Error("本地 Agent 状态不可读");
   agentStatus=await result.json();
   agentError=null;
 }catch{
   agentError="请检查启动终端、Python 依赖及状态目录，然后重试。";
 }finally{
   agentLoading=false;
   render();
 }
}
const empty = () => ({version:1,cases:[],alphas:[]});
let data=empty(), recordsReady=!localAgent;
if(!localAgent){try { const saved=localStorage.getItem(key); if(saved) data=JSON.parse(saved); } catch {}}
let view="board", selected=new Set(), filters={}, editing, toastTimer;
const tag=(s,t="")=>'<span class="tag '+t+'">'+esc(s)+'</span>';
const button=(label, action, id="", css="", workflow="")=>'<button type="button" class="'+css+'" data-act="'+action+'" data-id="'+esc(id)+'"'+(workflow?' data-workflow="'+esc(workflow)+'"':"")+'>'+esc(label)+'</button>';
const text=(v)=>typeof v==="string" && v.trim().length>0;
const numeric=(v)=>typeof v==="number" && Number.isFinite(v);
const num=(v)=>numeric(v)?String(v):"—";
const workflow=(c)=>labels[c.workflow]+(c.ppa?" · PPA":"");
const findCase=(id)=>data.cases.find(c=>c.id===id);
const fieldSet=(value)=>String(value??"").split(/[,，\n]+/).map(v=>v.trim()).filter(Boolean);
function notify(message){$("#toast").textContent=message;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$("#toast").textContent="",4500);}
async function saveWorkbenchRecords(next){
 const response=await fetch("/api/workbench-records",{method:"POST",
   headers:{"Content-Type":"application/json"},body:JSON.stringify(next)});
 const result=await readWorkbenchJson(response);
 if(!response.ok)throw Error(result.error||"无法保存项目工作台记录");
}
async function persist(next){
 if(localAgent){
   if(!recordsReady)throw Error("项目记录尚未成功读取，请刷新页面后重试。");
   await saveWorkbenchRecords(next);
 }
 data=next;
 if(!localAgent){try{localStorage.setItem(key,JSON.stringify(next));}catch{}}

function raPassed(a){return a.raCount===0 && a.raFinal==="pass" && text(a.raRef);}
function review(a,c){
  const m=a.metrics??{}, pending=[];
  const policy=qualificationPolicy(), gate=policy.candidate, preferred=policy.preferred;
  if(a.raFinal==="fail" || a.raCount>0) return ["raFail","RA 存在失败项"];
  if(!raPassed(a)) return [a.receipt?"pending":"draft","待补终态 RA 证据与失败数"];
  if(!numeric(a.corrLimit)||a.corrLimit!==gate.self_corr_max||!text(a.policyRef)||a.policyRef!==policy.policy_sha256)
    return ["pending","策略版本已变化或未绑定当前审核策略"];
  if(!numeric(m.local)||!text(a.localRef)) return ["pending","待补本地自相关预检证据"];
  if(Math.abs(m.local)>=gate.self_corr_max) return ["corrFail","本地自相关达到阈值"];
  if(a.localComplete!=="pass") return ["pending","待补近四年同区域非 PPA OS 样本的完整预检结论"];
  if(!numeric(m.prod)||!numeric(m.self)||!text(a.corrRef)) return ["corrReady","可在 Agent 中查询，回填 PC / SC 证据"];
  if(Math.abs(m.prod)>=gate.prod_corr_max||Math.abs(m.self)>=gate.self_corr_max) return ["corrFail","PC 或 SC 达到阈值"];
  if(!numeric(m.pairwise)||!text(a.pairRef)) return ["corrReady","待补最大组内相关性及其证据"];
  if(Math.abs(m.pairwise)>=gate.pairwise_corr_max) return ["corrFail","组内相关性达到阈值"];
  if(c.ppa){
    const ppaFields=new Set(fieldSet(a.fields));
    if(!numeric(m.sharpe)||!numeric(a.operatorCount)||!ppaFields.size)
      pending.push("PPA 本地资格证据待补");
    else if(m.sharpe<1||a.operatorCount>8||ppaFields.size>3)
      return ["blocked","PPA 资格未通过（Sharpe / 操作符数 / 字段数）"];
  }
  if(!text(a.receipt)||!text(a.settings)||!text(a.expression)||!text(a.alphaId)||!text(c.scopeEvidence)) pending.push("回测回执、定义、范围或有效设置待补");
  if(c.workflow==="regular" && (!text(a.dataset)||!text(a.category)||!text(a.universe)||!numeric(a.delay))) pending.push("Regular 有效范围待补");
  if(c.workflow==="optimization" && (!text(c.sourceSnapshot)||!text(c.region)||!text(c.sourceType))) pending.push("来源快照、类型或区域待补");
  if(a.pairwise==="fail"||a.auditStatus==="failed") return ["blocked","审计失败或组内冲突待裁决"];
  if(a.pairwise!=="pass"||!text(a.pairRef)) pending.push("组内去重证据待补");
  if(a.auditStatus!=="candidate"||!text(a.auditRef)) pending.push("Agent 完整 Candidate 审计与回读待补");
  if(pending.length) return ["audit",pending.join(" · ")];
  const subUniversePass=preferred.require_sub_universe_pass===false||a.subUniverse==="pass";
  if(a.preferredStatus==="preferred"&&text(a.preferredRef)&&numeric(m.sharpe)&&numeric(m.fitness)&&numeric(m.turnover)&&numeric(m.weight)&&
     m.sharpe>=preferred.sharpe_min&&m.fitness>=preferred.fitness_min&&
     m.turnover>=preferred.turnover_min&&m.turnover<=preferred.turnover_max&&
     Math.abs(m.weight)<=preferred.weight_max&&subUniversePass)
    return ["preferred","Candidate 已核对，Preferred 证据通过"];
  return ["candidate",a.preferredStatus==="failed"?"Preferred 未通过":"待核对 preferred-v1 结果"];
}

async function researchAction(action,id,selection={}){
 if(action==="delete"&&!window.confirm("删除这项研究及其本地文件？此操作无法撤销。"))return;
 if(action==="recover"&&!window.confirm("将核对该 Simulation Intent 的平台回执。不会自动重发 Simulation。是否继续？"))return;
 if(action==="acknowledge-interrupted"&&!window.confirm("请先在任务管理器/进程列表确认旧 alpha_research 子进程已经完全退出。确认后工作台才允许启动新任务。是否已确认？"))return;
 try{
   const response=await fetch("/api/research",{method:"POST",headers:{"Content-Type":"application/json"},
     body:JSON.stringify({action,id,...selection})});
   const result=await readWorkbenchJson(response);
   if(!response.ok)throw Error(result.error||"研究操作失败");
   if(action==="delete"){
     notify("研究已删除");
     await refreshLaunch();
     await refreshAgent();
   }else{
     showLaunchState(result);
     await refreshLaunch();
   }
 }catch(error){
   notify(error.message);
 }
}

    editing.record.corrLimit!==policy.candidate.self_corr_max));

function checkCase(c){
 if(!c||typeof c!=="object"||Array.isArray(c)||!text(c.id)||!text(c.name)||
    !Object.hasOwn(labels,c.workflow)||!Object.hasOwn(phases,c.phase))
   throw Error("请检查任务 ID、名称、工作流和阶段。");
 if(c.workflow==="optimization"?!text(c.sourceId):!text(c.region))
   throw Error("请填写所需的区域或来源 Alpha ID。");
 if(c.region!=null&&!text(c.region))throw Error("Region 必须是文本。");
 for(const key of ["dataset","category","universe","objective","constraints","scopeEvidence",
                   "coverage","budget","sourceId","sourceType","sourceSnapshot"])
   if(c[key]!=null&&typeof c[key]!=="string")throw Error(key+" 必须是文本。");
 if(c.sourceType!=null&&!["regular","super"].includes(c.sourceType))
   throw Error("来源类型必须是 Regular 或 Super。");
 if(c.ppa!=null&&typeof c.ppa!=="boolean")throw Error("PPA Profile 必须是布尔值。");
 if(c.delay!=null&&(!Number.isInteger(c.delay)||c.delay<0))
   throw Error("Delay 必须是非负整数。");
 if(c.history!=null&&(!Array.isArray(c.history)||c.history.some(item=>
    !item||typeof item!=="object"||!Object.hasOwn(phases,item.phase)||
    typeof item.at!=="string"||!Number.isFinite(Date.parse(item.at)))))
   throw Error("阶段历史记录格式无效。");
}
function checkAlpha(a,c){
 if(!a||typeof a!=="object"||Array.isArray(a)||!c||!text(c.id)||
    !text(a.id)||a.caseId!==c.id||!text(a.name)||
    !a.metrics||typeof a.metrics!=="object"||Array.isArray(a.metrics))
   throw Error("Alpha 记录缺少有效 ID、任务关联、名称或指标对象。");
 for(const [k,v] of Object.entries(a.metrics)){
   if(!Object.hasOwn(metrics,k)||!numeric(v))throw Error("无效的指标值。");
   if(["local","prod","self","pairwise"].includes(k)&&Math.abs(v)>1)throw Error("相关性必须在 -1 到 1 之间。");
 }
 for(const key of ["alphaId","dataset","category","universe","expression","fields","operators",
                   "idea","dataReason","operatorReason","economics","settings","receipt","units",
                   "raRef","policyRef","localRef","corrRef","pairRef","auditRef","preferredRef",
                   "submissionNote"])
   if(a[key]!=null&&typeof a[key]!=="string")throw Error(key+" 必须是文本。");
 for(const [key,allowed] of Object.entries({
   raFinal:["pass","fail","pending"],localComplete:["pass","fail","pending"],
   pairwise:["pass","fail","pending"],auditStatus:["candidate","failed","pending"],
   preferredStatus:["preferred","failed","pending"],subUniverse:["pass","fail","pending"],
 }))
   if(a[key]!=null&&!allowed.includes(a[key]))throw Error(key+" 的审核状态无效。");
 if(a.corrLimit!=null&&(!numeric(a.corrLimit)||a.corrLimit<=0||a.corrLimit>1))
   throw Error("相关性阈值必须在 0 到 1 之间。");
 for(const k of ["delay","raCount","operatorCount"]) if(a[k]!=null&&(!Number.isInteger(a[k])||a[k]<0))throw Error("Delay、RA fail count 和操作符次数必须是非负整数。");
 if(c.workflow==="regular"){
   if(c.dataset&&a.dataset&&!fieldSet(c.dataset).includes(a.dataset))throw Error("有效 Dataset 超出用户指定范围。");
   for(const k of ["category","delay","universe"])if(c[k]!=null&&a[k]!=null&&c[k]!==a[k])throw Error("有效 "+k+" 与用户硬约束冲突。");

function changedFields(original,next,keys){
 return keys.some(key=>JSON.stringify(original?.[key]??null)!==JSON.stringify(next?.[key]??null));
}
function changedMetrics(original,next,keys){
 return keys.some(key=>JSON.stringify(original?.metrics?.[key]??null)!==JSON.stringify(next?.metrics?.[key]??null));
}
function clearAlphaEvidence(record,metricKeys,fieldKeys){
 const measured={...(record.metrics||{})};
 metricKeys.forEach(key=>delete measured[key]);
 record.metrics=measured;
 fieldKeys.forEach(key=>{record[key]=null;});
}
function invalidateAlphaEvidence(original,next,force=false){
 if(!original?.id)return next;
 const allEvidence=["raCount","raFinal","raRef","localRef","localComplete","corrRef",
  "pairwise","pairRef","auditStatus","auditRef","preferredStatus","preferredRef","subUniverse"];
 const correlationMetrics=["local","prod","self","pairwise"];
 const performanceMetrics=Object.keys(metrics).filter(key=>!correlationMetrics.includes(key));
 if(force){
  clearAlphaEvidence(next,Object.keys(metrics),allEvidence);
  next.alphaId=null;
  next.settings=null;
  next.receipt=null;
  return next;
 }
 const definitionChanged=changedFields(original,next,[
  "expression","fields","operators","settings","dataset","category",
  "delay","universe","operatorCount","units"
 ]);
 const alphaIdChanged=changedFields(original,next,["alphaId"]);
 const receiptChanged=changedFields(original,next,["receipt"]);
 const performanceChanged=changedMetrics(original,next,performanceMetrics);
 if(definitionChanged){
  clearAlphaEvidence(next,Object.keys(metrics),allEvidence);
  if(!alphaIdChanged)next.alphaId=null;
  if(!receiptChanged)next.receipt=null;
  return next;
 }
 if(performanceChanged||receiptChanged||alphaIdChanged){
  clearAlphaEvidence(next,correlationMetrics,allEvidence);
  if((performanceChanged||alphaIdChanged)&&!receiptChanged)next.receipt=null;
  return next;
 }
 if(changedFields(original,next,["raCount","raFinal","raRef"])){
  clearAlphaEvidence(next,correlationMetrics,[
   "localRef","localComplete","corrRef","pairwise","pairRef",
   "auditStatus","auditRef","preferredStatus","preferredRef","subUniverse"
  ]);
  return next;
 }
 const policyChanged=changedFields(original,next,["corrLimit","policyRef"]);
 const localMetricChanged=changedMetrics(original,next,["local"]);
 const localEvidenceChanged=changedFields(original,next,["localRef","localComplete"]);
 if(policyChanged||localMetricChanged||localEvidenceChanged){
  clearAlphaEvidence(next,["prod","self","pairwise"],[
   "corrRef","pairwise","pairRef","auditStatus","auditRef",
   "preferredStatus","preferredRef","subUniverse"
  ]);
  if((policyChanged||localMetricChanged)&&!changedFields(original,next,["localRef"]))
   next.localRef=null;
  if((policyChanged||localMetricChanged||changedFields(original,next,["localRef"]))
      &&!changedFields(original,next,["localComplete"]))
   next.localComplete=null;
  return next;
 }
 const platformChanged=changedMetrics(original,next,["prod","self"])
  ||changedFields(original,next,["corrRef"]);
 if(platformChanged){
  clearAlphaEvidence(next,["pairwise"],[
   "pairwise","pairRef","auditStatus","auditRef","preferredStatus","preferredRef","subUniverse"
  ]);
  if(changedMetrics(original,next,["prod","self"])
      &&!changedFields(original,next,["corrRef"]))next.corrRef=null;
  return next;
 }
 const pairwiseChanged=changedMetrics(original,next,["pairwise"])
  ||changedFields(original,next,["pairwise","pairRef"]);
 if(pairwiseChanged){
  clearAlphaEvidence(next,[],["auditStatus","auditRef","preferredStatus","preferredRef","subUniverse"]);
  if(changedMetrics(original,next,["pairwise"])
      &&!changedFields(original,next,["pairRef"]))next.pairRef=null;
  return next;
 }
 if(changedFields(original,next,["auditStatus","auditRef"])){
  clearAlphaEvidence(next,[],["preferredStatus","preferredRef","subUniverse"]);
  return next;
 }
 if(changedFields(original,next,["subUniverse"])){
  clearAlphaEvidence(next,[],["preferredStatus","preferredRef"]);
  return next;
 }
 if(changedFields(original,next,["preferredStatus"])&&
    !changedFields(original,next,["preferredRef"]))next.preferredRef=null;
 return next;
}

async function submit(e){
 if(editing?.kind==="credentials"){
   e.preventDefault();
   saveCredentials(e.currentTarget);
   return;
 }
 if(editing?.kind==="launch"){
   e.preventDefault();
   launchCampaign(e.currentTarget);
   return;
 }
 if(editing?.kind==="resume"){
   e.preventDefault();
   resumeCampaign(e.currentTarget);
   return;
 }
 e.preventDefault();
 if(!editing)return;
 const form=e.target, fields=Object.fromEntries(new FormData(form));const values={};
 for(const [k,v] of Object.entries(fields)) values[k]=v.trim()||null;
 for(const k of ["delay","raCount","corrLimit","operatorCount"]) if(values[k]!=null)values[k]=Number(values[k]);
 const original=editing.record;
 const next=structuredClone(data);
 try {
   if(editing.kind==="case"){
     const c={...original,...values,id:original.id||crypto.randomUUID(),workflow:editing.workflow,ppa:original.id?original.ppa:values.ppa==="yes"};
     if(original.region)c.region=original.region;
     if(c.region)c.region=c.region.toUpperCase();
     checkCase(c);
     if(original.phase!==c.phase)c.history=[...(original.history||[]),{phase:c.phase,at:new Date().toISOString()}];
     const sourceChanged=Boolean(original.id&&c.workflow==="optimization"&&
       changedFields(original,c,["sourceType","sourceSnapshot","region"]));
     if(sourceChanged){
       next.alphas=next.alphas.map(alpha=>alpha.caseId===c.id
         ?invalidateAlphaEvidence(alpha,{...alpha,metrics:{...(alpha.metrics||{})}},true):alpha);
     }
     next.cases=next.cases.filter(x=>x.id!==c.id).concat(c);
     view="cases";
   }else{
     const measured={...(original.metrics||{})};
     for(const k of Object.keys(metrics)){
       const control=form.elements["metric_"+k],raw=fields["metric_"+k];
       if(control&&!control.disabled){
         if(raw==null||raw==="")delete measured[k];
         else measured[k]=Number(raw);
       }
       delete values["metric_"+k];
     }
     const a={...original,...values,id:original.id||crypto.randomUUID(),caseId:editing.caseId,metrics:measured};
     invalidateAlphaEvidence(original,a);
     if(!raPassed(a)||!numeric(a.metrics.local)||
        Math.abs(a.metrics.local)>=qualificationPolicy().candidate.self_corr_max)a.corrRef=null;
     checkAlpha(a,findCase(a.caseId));
     next.alphas=next.alphas.filter(x=>x.id!==a.id).concat(a);
   }
   await persist(next);dialog.close();render();notify(localAgent?"记录已保存到项目状态目录":"记录已保存到当前浏览器");
 }catch(err){$("#form-error").textContent=err.message;}
}

$("#file").onchange=async(e)=>{
 const file=e.target.files[0];e.target.value="";if(!file)return;
 try {
   if(file.size>5*1024*1024)throw Error("文件超过 5 MB。");
   const incoming=JSON.parse(await file.text());
   if(incoming?.version!==1||!Array.isArray(incoming.cases)||!Array.isArray(incoming.alphas))throw Error("请选择工作台导出的 v1 JSON。");
   const merge=(existing,items,check)=>{
     const records=new Map(existing.map(item=>[item.id,item]));
     for(const item of items){
       if(!item||!text(item.id))throw Error("记录缺少 ID。");
       check(item);
       if(records.has(item.id)&&JSON.stringify(records.get(item.id))!==JSON.stringify(item))throw Error("发现同 ID 的不同版本，导入已停止。");
       records.set(item.id,item);
     }
     return [...records.values()];
   };
   const cases=merge(data.cases,incoming.cases,checkCase);
   const alphas=merge(data.alphas,incoming.alphas,a=>checkAlpha(a,cases.find(c=>c.id===a.caseId)));
   await persist({version:1,cases,alphas});render();notify("已合并导入研究记录");
 }catch(err){notify("导入失败。"+err.message);}
};
