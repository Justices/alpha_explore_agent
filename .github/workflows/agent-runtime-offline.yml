name: Configurable research runtime offline verification
on:
  push:
    branches:
      - refactor/configurable-codex-agy-runtime
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      BRAIN_USERNAME: ""
      BRAIN_PASSWORD: ""
      BRAIN_API_TOKEN: ""
      GEMINI_API_KEY: ""
      DEEPSEEK_API_KEY: ""
      ZAI_API_KEY: ""
      MOONSHOT_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
      BRAIN_CREDENTIALS_FILE: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Normalize Windows temp path aliases
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $canonical = python -c "import os,pathlib; print(pathlib.Path(os.environ['TEMP']).resolve())"
          "TEMP=$canonical" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$canonical" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install package (no AGY optional dependency)
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q alpha_research tests
      - name: Registry CLI smoke (no provider or BRAIN calls)
        run: |
          python -m alpha_research models list
          python -m alpha_research --lead codex --executor glm models inspect
          python -m alpha_research --lead kimi --executor claude-code models inspect
      - name: P3 offline smoke (never calls model or BRAIN)
        run: python -m alpha_research --lead codex --executor glm models smoke --role research_lead
      - name: Full offline suite (single run; includes all domain and P3 tests)
        run: python -m unittest discover -s tests -v
      - name: Mock research CLI smoke (no network)
        run: |
          python -m alpha_research.research_cycle --config config.mock.example.json --fixtures tests/fixtures/research_cycle_simulations.json --research-id R1 --objective "offline demo" --region CHN --state-root .alpha-ci-runtime --durable --max-rounds 1


  macos-prepared-domain-mock:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      BRAIN_USERNAME: ""
      BRAIN_PASSWORD: ""
      BRAIN_API_TOKEN: ""
      DEEPSEEK_API_KEY: ""
      ZAI_API_KEY: ""
      MOONSHOT_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
      BRAIN_CREDENTIALS_FILE: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Normalize macOS temporary-directory alias
        shell: bash
        run: |
          mkdir -p "$HOME/.cache/alpha-research-ci-tmp"
          echo "TMPDIR=$(cd "$HOME/.cache/alpha-research-ci-tmp" && pwd -P)/" >> "$GITHUB_ENV"
      - name: Install package
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q alpha_research tests
      - name: Prepared task and real offline domain CLI integration (no network)
        run: |
          python -m unittest discover -s tests -p 'test_orchestration_prepare_cli.py' -v
          python -m unittest discover -s tests -p 'test_orchestration_run_cli.py' -v
          python -m unittest discover -s tests -p 'test_orchestration_domain_mock_cli.py' -v
          python -m unittest discover -s tests -p 'test_full_mock_orchestration.py' -v


  agy-sdk-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ""
      DEEPSEEK_API_KEY: ""
      ZAI_API_KEY: ""
      MOONSHOT_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
      BRAIN_CREDENTIALS_FILE: ""
      BRAIN_USERNAME: ""
      BRAIN_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional AGY SDK (no auth configured)
        run: python -m pip install -e ".[agy]"
      - name: SDK config construction only
        run: python tests/verify_agy_sdk_contract.py
