name: Configurable research runtime offline verification
on:
  push:
    branches:
      - refactor/configurable-codex-agy-runtime
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      BRAIN_USERNAME: ""
      BRAIN_PASSWORD: ""
      BRAIN_API_TOKEN: ""
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Normalize Windows temp path aliases
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $canonical = python -c "import os,pathlib; print(pathlib.Path(os.environ['TEMP']).resolve())"
          "TEMP=$canonical" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$canonical" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install package (no AGY optional dependency)
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q alpha_research tests
      - name: Registry CLI smoke (no provider or BRAIN calls)
        run: |
          python -m alpha_research models list
          python -m alpha_research --lead codex --executor glm models inspect
          python -m alpha_research --lead kimi --executor claude-code models inspect
      - name: Inspect offline role configuration
        run: |
          python -m alpha_research.agents --config config.mock.example.json --task plan_experiments --task prepare_execution
      - name: Configurable runtime offline tests
        run: python -m unittest discover -s tests -p 'test_configurable_agents.py' -v
      - name: Model registry offline tests
        run: python -m unittest discover -s tests -p 'test_model_registry.py' -v
      - name: Durable research offline tests
        run: python -m unittest discover -s tests -p 'test_durable_research_cycle.py' -v
      - name: Full offline suite
        run: python -m unittest discover -s tests -v
      - name: Mock research CLI smoke (no network)
        run: |
          python -m alpha_research.research_cycle --config config.mock.example.json --fixtures tests/fixtures/research_cycle_simulations.json --research-id R1 --objective "offline demo" --region CHN --state-root .alpha-ci-runtime --durable --max-rounds 1


  agy-sdk-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ""
      BRAIN_USERNAME: ""
      BRAIN_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional AGY SDK (no auth configured)
        run: python -m pip install -e ".[agy]"
      - name: SDK config construction only
        run: python tests/verify_agy_sdk_contract.py
