name: Offline Python verification

on:
  push:
    branches:
      - feat/research-scope-v1-1-recovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      BRAIN_USERNAME: ""
      BRAIN_PASSWORD: ""
      BRAIN_API_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Candidate pool
        run: python -m unittest discover -s tests -p 'test_candidate_pool.py'
      - name: Simulation intent (mock only)
        run: python -m unittest discover -s tests -p 'test_simulation_intent.py'
      - name: Independent runtime (mock only)
        run: python -m unittest discover -s tests -p 'test_independent_runtime.py'
      - name: CLI (mock only)
        run: python -m unittest discover -s tests -p 'test_cli.py'
      - name: Orchestrator (mock only)
        run: python -m unittest discover -s tests -p 'test_orchestrator.py'
      - name: Existing workflow adapter (mock only)
        run: python -m unittest discover -s tests -p 'test_workflow_adapter.py'
      - name: Full offline suite
        run: python -m unittest discover -s tests
