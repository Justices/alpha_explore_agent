name: P6 isolated readiness verification

on:
  push:
    branches:
      - refactor/configurable-codex-agy-runtime
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p6-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p6-contract-offline:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.11"
          - os: macos-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      BRAIN_USERNAME: ""
      BRAIN_PASSWORD: ""
      BRAIN_API_TOKEN: ""
      BRAIN_CREDENTIALS_FILE: ""
      OPENAI_API_KEY: ""
      GEMINI_API_KEY: ""
      DEEPSEEK_API_KEY: ""
      ZAI_API_KEY: ""
      MOONSHOT_API_KEY: ""
      ANTHROPIC_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Normalize Windows temp path aliases
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $canonical = python -c "import os,pathlib; print(pathlib.Path(os.environ['TEMP']).resolve())"
          "TEMP=$canonical" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$canonical" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Normalize macOS temporary-directory alias
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p "$HOME/.cache/alpha-research-ci-tmp"
          echo "TMPDIR=$(cd "$HOME/.cache/alpha-research-ci-tmp" && pwd -P)/" >> "$GITHUB_ENV"
      - name: Install package without provider credentials
        run: python -m pip install -e .
      - name: Compile all modules and tests
        run: python -m compileall -q alpha_research tests
      - name: P7 isolated authority secret and recovery readiness contracts
        run: python -m unittest discover -s tests -p 'test_p7_authority_deployment.py' -v
      - name: P7 container and Linux Compose build contract (no deploy)
        if: matrix.os == 'ubuntu-latest'
        run: |
          docker compose -f deploy/p7/compose.yaml config --quiet
          docker build -f deploy/p7/Dockerfile -t alpha-research-authority:p7-ci .
      - name: P7 disposable Linux Docker mTLS startup and durable Stop rehearsal
        if: matrix.os == 'ubuntu-latest'
        run: python deploy/p7/container_smoke.py
      - name: P4-P6 authority, SDK, mTLS and Canary offline contracts
        run: python -m unittest discover -s tests -p 'test_p4_research_final_release.py' -v
      - name: Production release remains negative
        run: python -m unittest discover -s tests -p 'test_p4_release_gate.py' -v
      - name: Full P6-compatible offline regression (all business modules)
        run: python -m unittest discover -s tests -v
